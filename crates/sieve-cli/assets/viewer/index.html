<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sieve symbol map</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <svg class="mark" viewBox="0 0 12 6" width="36" height="18" shape-rendering="crispEdges" role="img" aria-label="Sieve mascot"><rect x="11" y="0" width="1" height="1" fill="#d5dbef"/><rect x="10" y="1" width="1" height="1" fill="#d5dbef"/><rect x="0" y="2" width="1" height="1" fill="#9aa5c8"/><rect x="1" y="2" width="8" height="1" fill="#d5dbef"/><rect x="9" y="2" width="1" height="1" fill="#9aa5c8"/><rect x="1" y="3" width="1" height="1" fill="#9aa5c8"/><rect x="2" y="3" width="1" height="1" fill="#e2e6f3"/><rect x="3" y="3" width="1" height="1" fill="#b4bcd9"/><rect x="4" y="3" width="1" height="1" fill="#3b4261"/><rect x="5" y="3" width="1" height="1" fill="#b4bcd9"/><rect x="6" y="3" width="1" height="1" fill="#3b4261"/><rect x="7" y="3" width="1" height="1" fill="#b4bcd9"/><rect x="8" y="3" width="1" height="1" fill="#9aa5c8"/><rect x="2" y="4" width="1" height="1" fill="#9aa5c8"/><rect x="3" y="4" width="1" height="1" fill="#b4bcd9"/><rect x="4" y="4" width="1" height="1" fill="#3b4261"/><rect x="5" y="4" width="1" height="1" fill="#b4bcd9"/><rect x="6" y="4" width="1" height="1" fill="#3b4261"/><rect x="7" y="4" width="1" height="1" fill="#9aa5c8"/><rect x="3" y="5" width="1" height="1" fill="#eef0f6"/><rect x="6" y="5" width="1" height="1" fill="#eef0f6"/><rect x="9" y="5" width="1" height="1" fill="#eef0f6"/></svg>
    <b class="name">Sieve</b>
    <span class="repo-name" id="repo-name"></span>
    <span class="repo-note" id="repo-note"></span>
    <nav class="views" id="views"></nav>
    <input class="finder" id="finder" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search by name">
  </header>
  <section class="stage">
    <canvas class="plane" id="plane"></canvas>
    <p class="status" id="status"></p>
    <div class="key" id="key"></div>
    <div class="listing" id="listing" hidden></div>
    <aside class="detail" id="detail"></aside>
  </section>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
