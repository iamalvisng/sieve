[package]
name = "sieve-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sieve-core = { path = "../sieve-core" }
sieve-parse = { path = "../sieve-parse" }
sieve-query = { path = "../sieve-query" }
sieve-savings = { path = "../sieve-savings" }
notify = "8.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
# kqueue sync on macOS (ledger 2026-10-30). Already in Cargo.lock under notify.
libc = "0.2"
